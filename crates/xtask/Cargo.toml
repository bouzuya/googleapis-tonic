[package]
name = "xtask"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
async-recursion = "1.2"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11.0"
tokio = { version = "1.53", features = ["full"] }
toml_edit = "0.25"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.27"
